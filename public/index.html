<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World 信息站</title>
  <style>
    :root {
      --bg: #f5f6fa; --card: #ffffff; --text: #333; --muted: #888;
      --accent: #4f6ef2; --btn: #4f6ef2; --btn-text: #fff;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #17181d; --card: #23252d; --text: #eee; --muted: #999; --btn: #5b7bff; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, var(--bg), var(--card));
      padding: 16px;
    }
    .card {
      background: var(--card); border-radius: 18px; padding: 36px 40px;
      max-width: 580px; width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,.12); text-align: center;
    }
    h1 { font-size: 20px; color: var(--accent); margin: 0 0 18px; }
    .greet { font-size: 15px; color: var(--muted); margin: 0 0 16px; }
    .big {
      font-size: 28px; line-height: 1.7; margin: 0 0 24px; color: var(--text);
      min-height: 3.4em; display: flex; align-items: center; justify-content: center;
    }
    .meta { font-size: 13px; color: var(--muted); line-height: 2; margin: 0 0 26px; }
    .meta b { color: var(--text); font-weight: 600; }
    button {
      border: none; border-radius: 999px; padding: 12px 34px; font-size: 16px;
      background: var(--btn); color: var(--btn-text); cursor: pointer;
      transition: transform .1s, opacity .2s; font-family: inherit;
    }
    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: .5; cursor: wait; }
    .ws-time {
      font-size: clamp(24px, 7.5vw, 34px); font-weight: 700; color: var(--accent);
      margin: 0 0 6px; font-variant-numeric: tabular-nums; letter-spacing: 1px;
    }
    .ws-status { font-size: 12px; margin: 0 0 18px; }
    .ws-status.connected { color: #2ecc71; }
    .ws-status.disconnected { color: #e74c3c; }
    .links { margin-top: 22px; font-size: 13px; color: var(--muted); }
    .links a { color: var(--accent); text-decoration: none; margin: 0 8px; }
    .links a:hover { text-decoration: underline; }

    /* ===== 新增：输入框 & 消息列表样式 ===== */
    .input-section { margin: 24px 0 0; text-align: left; border-top: 1px solid rgba(128,128,128,.2); padding-top: 20px; }
    .input-section h2 { font-size: 16px; color: var(--accent); margin: 0 0 12px; text-align: center; }
    .input-row { display: flex; gap: 8px; margin-bottom: 14px; }
    .input-row input {
      flex: 1; padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(128,128,128,.3);
      font-size: 14px; background: var(--bg); color: var(--text); outline: none; font-family: inherit;
    }
    .input-row input:focus { border-color: var(--accent); }
    .input-row button { padding: 10px 22px; font-size: 14px; border-radius: 10px; white-space: nowrap; }
    .msg-list { list-style: none; padding: 0; margin: 0; max-height: 260px; overflow-y: auto; text-align: left; }
    .msg-list li {
      padding: 10px 14px; margin-bottom: 6px; border-radius: 10px;
      background: var(--bg); font-size: 13px; color: var(--text); line-height: 1.6;
      word-break: break-word;
    }
    .msg-list li .msg-time { font-size: 11px; color: var(--muted); margin-top: 4px; display: block; }
    .msg-empty { text-align: center; color: var(--muted); font-size: 13px; padding: 16px 0; }
    .save-tip { font-size: 12px; text-align: center; margin-top: 6px; min-height: 18px; }
    .save-tip.ok { color: #2ecc71; }
    .save-tip.err { color: #e74c3c; }
  </style>
</head>
<body>
  <main class="card">
    <h1>🍩 Hello World 信息站</h1>
    <p class="ws-time" id="wsTime">--:--:--</p>
    <p class="ws-status disconnected" id="wsStatus">⏳ 正在连接实时时钟…</p>
    <p class="greet" id="greeting">正在读取问候语…</p>
    <p class="big" id="message">正在获取随机信息…</p>
    <p class="meta" id="meta">加载中…</p>
    <button id="next">换一条信息</button>

    <!-- 新增：文本输入 & 历史消息 -->
    <div class="input-section">
      <h2>💬 留言存入数据库</h2>
      <div class="input-row">
        <input type="text" id="msgInput" placeholder="输入你想说的话…" maxlength="2000" />
        <button id="saveBtn">保存</button>
      </div>
      <p class="save-tip" id="saveTip"></p>
      <ul class="msg-list" id="msgList"><li class="msg-empty">加载中…</li></ul>
    </div>

    <p class="links">
      <a href="/time">当前时间</a>
      <a href="/about">关于本站</a>
    </p>
  </main>
  <script>
    // ===== WebSocket 实时时钟 =====
    const elTime = document.getElementById('wsTime');
    const elStatus = document.getElementById('wsStatus');
    let ws = null;
    function connectWs() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(proto + '//' + location.host + '/ws/time');
      ws.onopen = () => {
        elStatus.textContent = '🟢 实时时钟已连接';
        elStatus.className = 'ws-status connected';
      };
      ws.onmessage = (e) => {
        try {
          const data = JSON.parse(e.data);
          if (data.type === 'time') elTime.textContent = data.time;
        } catch (err) { /* 忽略损坏的帧 */ }
      };
      ws.onclose = () => {
        elStatus.textContent = '🔴 连接断开，3秒后重连…';
        elStatus.className = 'ws-status disconnected';
        setTimeout(connectWs, 3000);
      };
      ws.onerror = () => ws.close();
    }
    connectWs();

    // ===== 原有功能：随机信息 =====
    const elGreet = document.getElementById('greeting');
    const elMsg = document.getElementById('message');
    const elMeta = document.getElementById('meta');
    const btn = document.getElementById('next');
    async function fetchMessage() {
      btn.disabled = true;
      btn.textContent = '加载中…';
      try {
        const res = await fetch('/api/message');
        const data = await res.json();
        elGreet.textContent = data.greeting;
        elMsg.textContent = data.message;
        elMeta.innerHTML =
          '🕐 服务器时间：<b>' + data.date + '</b><br>' +
          '📮 你的 IP：<b>' + data.ip + '</b> · UA：<b>' + navigator.userAgent.slice(0, 40) + '…</b>';
      } catch (e) {
        elMsg.textContent = '获取信息失败：' + e.message;
      } finally {
        btn.disabled = false;
        btn.textContent = '换一条信息';
      }
    }
    btn.addEventListener('click', fetchMessage);
    fetchMessage();

    // ===== 新增：保存消息 & 加载列表 =====
    const msgInput = document.getElementById('msgInput');
    const saveBtn = document.getElementById('saveBtn');
    const saveTip = document.getElementById('saveTip');
    const msgList = document.getElementById('msgList');

    function formatTime(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr);
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

    async function loadMessages() {
      try {
        const res = await fetch('/api/messages');
        const data = await res.json();
        if (data.error) { msgList.innerHTML = '<li class="msg-empty">' + data.error + '</li>'; return; }
        if (!data.messages || data.messages.length === 0) {
          msgList.innerHTML = '<li class="msg-empty">暂无留言，来说点什么吧 ✨</li>';
          return;
        }
        msgList.innerHTML = data.messages.map(m =>
          '<li>' + escapeHtml(m.content) + '<span class="msg-time">#' + m.id + ' · ' + formatTime(m.created_at) + '</span></li>'
        ).join('');
      } catch (e) {
        msgList.innerHTML = '<li class="msg-empty">加载失败：' + e.message + '</li>';
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    async function saveMessage() {
      const content = msgInput.value.trim();
      if (!content) { showTip('请输入内容', false); return; }
      saveBtn.disabled = true;
      saveBtn.textContent = '保存中…';
      showTip('', true);
      try {
        const res = await fetch('/api/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ content })
        });
        const data = await res.json();
        if (data.error) { showTip(data.error, false); }
        else {
          showTip('✅ 保存成功！', true);
          msgInput.value = '';
          loadMessages();
        }
      } catch (e) {
        showTip('保存失败：' + e.message, false);
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = '保存';
      }
    }

    function showTip(text, ok) {
      saveTip.textContent = text;
      saveTip.className = 'save-tip ' + (ok ? 'ok' : 'err');
    }

    saveBtn.addEventListener('click', saveMessage);
    msgInput.addEventListener('keydown', e => { if (e.key === 'Enter') saveMessage(); });
    loadMessages();
  </script>
</body>
</html>
